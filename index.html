<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6e6b">
  <script>
    (function () {
      var choice = 'system';
      try {
        var saved = localStorage.getItem('mnemosyne.theme');
        if (saved === 'dark' || saved === 'light' || saved === 'system') choice = saved;
      } catch (err) {}
      var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#141210' : '#0f6e6b');
    })();
  </script>
  <meta name="description" content="Mnemosyne，個人連結收藏。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mnemosyne">
  <title>Mnemosyne</title>
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Mnemosyne</h1>
        <p class="sub">智祥的收藏</p>
      </div>
      <div class="header-actions">
        <button type="button" id="nav-back" class="ghost" hidden>返回</button>
        <button type="button" id="nav-add" class="ghost" hidden>新增</button>
        <button type="button" id="nav-settings" class="ghost">設定</button>
      </div>
    </header>

    <p id="banner" class="banner" role="alert" hidden></p>

    <section id="view-list" hidden>
      <div id="list-tools" hidden>
        <input id="search" type="search" placeholder="搜尋標題、摘要、備註、分類或標籤" autocomplete="off" enterkeyhint="search">
        <div class="sort-row">
          <label for="sort">排序</label>
          <select id="sort">
            <option value="newest">最新</option>
            <option value="oldest">最舊</option>
            <option value="title">標題</option>
          </select>
        </div>
        <p class="hint filter-label">平台</p>
        <div id="platform-filters" class="chips"></div>
        <p class="hint filter-label">分類</p>
        <div id="category-filters" class="chips"></div>
        <div id="active-filters" class="chips" hidden></div>
        <p id="result-count" class="hint"></p>
      </div>
      <p id="list-status" class="hint" role="status" hidden></p>
      <div id="empty" class="empty" hidden>
        <p id="empty-text">還沒有收藏。</p>
        <button type="button" id="empty-add">新增第一則</button>
        <button type="button" id="clear-filters" class="ghost" hidden>清除條件</button>
      </div>
      <div id="cards"></div>
      <button type="button" id="show-more" class="ghost show-more" hidden>顯示更多</button>
    </section>

    <section id="view-form" hidden>
      <h2 id="form-heading">新增收藏</h2>
      <form id="item-form">
        <label for="item-url">網址</label>
        <input id="item-url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://" required>
        <div class="url-actions">
          <button type="button" id="preview-btn" class="ghost">讀取標題</button>
        </div>
        <p id="preview-status" class="hint field-note" role="status" hidden></p>

        <label for="item-title">標題</label>
        <input id="item-title" name="title" type="text" autocomplete="off">

        <label for="item-summary">摘要</label>
        <textarea id="item-summary" name="summary" rows="3"></textarea>

        <label for="item-note">備註</label>
        <textarea id="item-note" name="note" rows="2"></textarea>

        <div class="field-head">
          <span id="category-label">分類</span>
          <button type="button" id="new-category" class="ghost">新增分類</button>
        </div>
        <div id="chosen-category" class="chosen" hidden></div>
        <input id="category-search" type="search" placeholder="搜尋分類" autocomplete="off" aria-labelledby="category-label">
        <div id="category-list" class="cat-list" role="group" aria-labelledby="category-label"></div>
        <input id="item-category" name="category" type="hidden">

        <label for="item-tags">標籤</label>
        <input id="item-tags" name="tags" type="text" placeholder="閱讀, 稍後" autocomplete="off">
        <p class="hint field-note">用逗號分隔</p>

        <p id="form-message" class="banner" role="status" hidden></p>
        <div class="form-actions">
          <button type="submit" id="save-btn">儲存</button>
          <button type="button" id="form-delete" class="danger" hidden>刪除</button>
        </div>
      </form>
    </section>

    <section id="view-settings" hidden>
      <h2>設定</h2>
      <p class="hint">貼上金鑰。它只存在這台裝置，不會放進網址列。</p>
      <fieldset class="theme-choice">
        <legend>外觀</legend>
        <label><input type="radio" name="theme" value="dark"> 深色</label>
        <label><input type="radio" name="theme" value="light"> 淺色</label>
        <label><input type="radio" name="theme" value="system" checked> 跟隨系統</label>
      </fieldset>
      <form id="settings-form" autocomplete="off">
        <label for="secret-key">金鑰</label>
        <input id="secret-key" name="secret-key" type="password" spellcheck="false" autocomplete="off" required>
        <button type="button" id="toggle-key" class="ghost">顯示金鑰</button>
        <p id="settings-message" class="banner" role="status" hidden></p>
        <div class="form-actions">
          <button type="submit">儲存</button>
          <button type="button" id="clear-settings" class="ghost" hidden>清除這台裝置上的設定</button>
        </div>
      </form>
      <div class="backup">
        <p class="hint filter-label">備份</p>
        <p class="hint">下載這台裝置已經讀取的收藏。</p>
        <div class="form-actions">
          <button type="button" id="export-csv" class="ghost">匯出 CSV</button>
          <button type="button" id="export-json" class="ghost">匯出 JSON</button>
        </div>
        <p id="export-message" class="hint" role="status" hidden></p>
      </div>
    </section>
  </div>

  <div id="confirm" class="confirm" hidden>
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
      <p id="confirm-text">要刪除這則收藏嗎？</p>
      <p class="hint">刪除後不會留在清單裡。</p>
      <div class="form-actions">
        <button type="button" id="confirm-delete" class="danger">刪除</button>
        <button type="button" id="confirm-cancel" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <div id="category-dialog" class="confirm" hidden>
    <form id="category-form" class="confirm-card">
      <h2>新增分類</h2>
      <label for="new-cat-name">分類名稱</label>
      <input id="new-cat-name" type="text" placeholder="例如：科技、設計..." autocomplete="off" required>
      <label for="new-cat-parent">父分類</label>
      <select id="new-cat-parent">
        <option value="">未分類</option>
      </select>
      <p class="hint filter-label">顏色</p>
      <div id="swatches" class="swatches"></div>
      <label for="new-cat-hex">自訂顏色</label>
      <input id="new-cat-hex" type="text" value="#3d8195" spellcheck="false" autocomplete="off" inputmode="text">
      <p class="hint filter-label">預覽</p>
      <p id="cat-preview" class="cat-chip">例如：科技、設計...</p>
      <p id="category-dialog-message" class="banner" role="status" hidden></p>
      <div class="form-actions">
        <button type="button" id="cat-cancel" class="ghost">取消</button>
        <button type="submit" id="cat-create">建立</button>
      </div>
    </form>
  </div>

  <script src="./app.js"></script>
</body>
</html>
